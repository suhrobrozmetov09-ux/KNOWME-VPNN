
name: KNOWME VPN Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android and iOS
        run: flutter create --platforms=android,ios --org com.knowme .

      
      - name: Set compileSdk 36
        run: |
          FILE="android/app/build.gradle.kts"
          if [ ! -f "$FILE" ]; then
            FILE="android/app/build.gradle"
          fi

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Gradle file not found"
            exit 1
          fi

          sed -i \
            -e 's/flutter\.compileSdkVersion/36/g' \
            -e 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' \
            -e 's/compileSdk = [0-9]*/compileSdk = 36/g' \
            "$FILE"

          echo "CHECK COMPILE SDK:"
          grep -n "compileSdk" "$FILE"

          grep -q "36" "$FILE" || exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KNOWME-VPN-Android
          path: build/app/outputs/flutter-apk/app-release.apk
