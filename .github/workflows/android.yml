
name: KNOWME VPN Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android and iOS folders
        run: flutter create --platforms=android,ios --org com.knowme .

      - name: 
      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          changed = False

          for file in files:
              if not file.exists():
                  continue

              content = file.read_text()
              updated, count = re.subn(
                  r'(?m)^(\s*compileSdk(?:Version)?\s*=?\s*)[^\r\n]+',
                  r'\g<1>36',
                  content
              )

              if count:
                  file.write_text(updated)
                  print(f"UPDATED: {file}")
                  changed = True
                  for line in updated.splitlines():
                      if "compileSdk" in line:
                          print(line.strip())

          if not changed:
              raise SystemExit("ERROR: compileSdk qatori topilmadi!")
          PY


      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KNOWME-VPN-Android
          path: build/app/outputs/flutter-apk/app-release.apk
