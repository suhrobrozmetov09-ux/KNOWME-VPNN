
name: KNOWME VPN Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.knowme .

      - name: Set Android compile SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          p = next((f for f in files if f.exists()), None)

          if p is None:
              raise SystemExit("ERROR: Gradle file not found")

          s = p.read_text()
          s = s.replace("flutter.compileSdkVersion", "36")

          s = re.sub(
              r'(?m)^(\s*compileSdk\s*=\s*)\d+.*$',
              r'\g<1>36',
              s
          )

          s = re.sub(
              r'(?m)^(\s*compileSdkVersion\s+)\d+.*$',
              r'\g<1>36',
              s
          )

          p.write_text(s)

          print("Gradle file:", p)
          for line in s.splitlines():
              if "compileSdk" in line:
                  print(line)

          if not re.search(
              r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\b',
              s
          ):
              raise SystemExit("ERROR: compileSdk 36 was not set")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Check APK
        run: |
          echo "Searching for APK..."
          find build -type f -name "*.apk" -print
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KNOWME-VPN-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
